    <div class="product-page">
        <div class="product-gallery">
            <img id="mainFlowerImage" src="" alt="Fiore principale" class="main-img">
            <div class="thumbnails" id="flowerThumbnails">
            </div>
        </div>

        <div class="product-details">
            <h4 id="flowerName"></h4>
            <p class="price" id="productPrice"></p> 
            <p id="productDescription"></p>

            <div class="color-options">
                <h5>Colori disponibili:</h5>
                <div class="color-grid" id="colorGrid">
                    </div>
                <input type="hidden" id="selected-color" value="">
            </div>

            <div class="counter-container">
                <button id="minus">−</button>
                <input type="text" id="counter" value="1" readonly>
                <button id="plus">+</button>
            </div>

            <div class="product-actions">
                <button class="btn add-to-cart-btn" id="add-to-cart-btn">AGGIUNGI AL CARRELLO</button>
                <button class="btn buy" id="buy-now-btn">ACQUISTA SUBITO</button>
